plugins {
  id 'com.android.application'
  id 'com.github.triplet.play'
}

// Function to get the total number of Git commits
def getGitCommitCount() {
  try {
    def stdout = providers.exec {
      commandLine 'git', 'rev-list', '--count', 'HEAD'
    }.standardOutput.asText.get().trim()
    return stdout.isInteger() ? stdout.toInteger() : 1
  } catch (Exception ignored) {
    return 1
  }
}

android {
  compileSdkVersion 36
  buildToolsVersion '36.0.0'

  defaultConfig {
    applicationId "il.co.bensavit.beep"
    minSdkVersion 26
    targetSdkVersion 36
    versionCode getGitCommitCount()
    versionName "1.3." + getGitCommitCount()

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    resConfigs "en" // Optimize build speed by only including English resources in debug

    externalNativeBuild {
      cmake {
        cppFlags ""
        arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
      }
    }
    ndk {
      abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
    }
  }

  buildTypes {
    debug {
      ndk {
        // Build only common ABIs for development to save time.
        abiFilters 'arm64-v8a', 'x86_64'
      }
      externalNativeBuild {
        cmake {
          // When the AGP build type is Debug, the native (NDK/CMake) build does not run
          // compiler optimizations by default, causing a critical performance issue.
          // We force CMAKE_BUILD_TYPE to Release here so native code stays optimized
          // even in Debug AGP builds.
          arguments "-DCMAKE_BUILD_TYPE=Release"
        }
      }
    }

    release {
      signingConfig signingConfigs.debug
      minifyEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  packaging {
    jniLibs {
      useLegacyPackaging false
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/jni/whisper/CMakeLists.txt"
    }
  }
  ndkVersion "27.0.12077973"
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
    namespace 'il.co.bensavit.beep'
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.8.0'
  implementation 'com.google.android.material:material:1.14.0'
  implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
  
  // Google AI SDK for Gemini
  implementation 'com.google.ai.client.generativeai:generativeai:0.9.0'
  implementation 'com.google.guava:guava:33.0.0-android'

  implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
  implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'

  implementation 'androidx.security:security-crypto:1.1.0'

  implementation 'androidx.work:work-runtime:2.11.2'

  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

  implementation 'org.reactivestreams:reactive-streams:1.0.4'
  implementation 'uk.co.samuelwall:material-tap-target-prompt:3.3.2'
  implementation 'com.google.android.play:app-update:2.1.0'
  //litongjava
}

play {
  serviceAccountCredentials.set(file("../google-play-key.json"))
  track.set("internal")
}

